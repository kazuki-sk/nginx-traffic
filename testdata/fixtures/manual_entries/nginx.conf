error_log /dev/stderr;
pid /tmp/nginx-fixture.pid;
events {}
http {
    upstream app_backend {
        server 10.4.0.1:8080;
    }
    server {
        listen 8080;
        server_name api.example.internal;
        location / {
            proxy_pass http://app_backend;
            proxy_set_header Authorization "Basic dXNlcjpzZWNyZXQ=";
            proxy_set_header X-Api-Key abc123;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /secure/ {
            secure_link_md5 "$secure_link_expires$uri mysecret";
            set $api_token "tok-123";
            return 200 "$api_token";
        }
    }
}
