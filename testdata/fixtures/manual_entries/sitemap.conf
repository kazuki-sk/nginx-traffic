# Tool settings and manual entries for things that do not go through nginx.
settings {
    assume_superuser  on;
    stale_after       180d;
    inherited_show    proxy_read_timeout;
}

external grafana-mon {
    group     monitoring;
    endpoint  https://grafana.mon.internal:3000;
    listen    10.0.5.10:3000 ssl;
    backend   10.0.5.10:3000;
    depends   prometheus-mon;
    owner     infra-mon;
    note      "共通基盤（このnginx）から独立。nginx 障害時の監視用";
    reviewed  2026-10-01;
}

annotate server api.example.internal {
    owner  team-api;
    note   "外部 SaaS からの Webhook を受ける";
}
annotate upstream app_backend {
    expect 10.4.0.1:8080;
    expect 10.4.0.2:8080;
}
# stale: no such server in nginx
annotate server gone.example.internal {
    note "removed last year";
}

include manual.d/*.conf;
