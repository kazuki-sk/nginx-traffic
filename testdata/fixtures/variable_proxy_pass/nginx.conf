error_log /dev/stderr;
pid /tmp/nginx-fixture.pid;
events {}

http {
    resolver 127.0.0.53 valid=30s;
    upstream blue { server 10.2.0.1:80; }
    upstream green { server 10.2.0.2:80; }
    map $cookie_deploy $color {
        default blue;
        canary  green;
    }
    server {
        listen 8080;
        server_name var.example;
        location / {
            proxy_pass http://$color;
        }
        location /host/ {
            proxy_pass http://$host:8080;
        }
        location /const/ {
            set $target 10.2.0.9:8080;
            proxy_pass http://$target;
        }
        location /dns/ {
            set $svc api.internal.example;
            proxy_pass https://$svc;
        }
    }
}
