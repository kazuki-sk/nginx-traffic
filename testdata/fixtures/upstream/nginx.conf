error_log /dev/stderr;
pid /tmp/nginx-fixture.pid;
events {}

http {
    upstream backend {
        least_conn;
        server 10.0.0.11:8080 weight=5 max_fails=3 fail_timeout=30s;
        server 10.0.0.12:8080 max_conns=100;
        server 10.0.0.13:8080 backup;
        server 10.0.0.14:8080 down;
        keepalive 16;
    }
    upstream hashed {
        hash $request_uri consistent;
        server unix:/run/app.sock;
        server 10.0.0.21:8080;
    }
    server {
        listen 8080;
        server_name up.example;
        location / {
            proxy_pass http://backend;
        }
        location /h/ {
            proxy_pass http://hashed/;
        }
        # upstream name "Backend" matched case-insensitively (ngx_http_upstream_add)
        location /case/ {
            proxy_pass http://Backend;
        }
        # IP literal → implicit upstream 10.0.0.99:80
        location /ip/ {
            proxy_pass http://10.0.0.99;
        }
        location /php/ {
            fastcgi_pass unix:/run/php-fpm.sock;
        }
        location /grpc/ {
            grpc_pass grpc://10.0.0.31:50051;
        }
        location /later/ {
            proxy_pass http://defined_later;
        }
    }
    # defined after use: still matched (ngx_http_upstream_add searches all)
    upstream defined_later { server 10.0.0.41:80; }
}
