error_log /dev/stderr;
pid /tmp/nginx-fixture.pid;
events {}
http {
    upstream app { server 10.5.0.1:8080; server 10.5.0.2:8080; }
    # an upstream whose member is this nginx itself
    upstream cache_layer { server 127.0.0.1:8081; keepalive 8; }
    proxy_cache_path /tmp/nginx-fixture-cache keys_zone=c:1m;

    # cache layer: default server of 127.0.0.1:8081
    server {
        listen 127.0.0.1:8081 default_server;
        server_name cache.local;
        location / {
            proxy_cache c;
            proxy_pass http://app;
        }
    }
    # auth layer: chosen by the Host header on 127.0.0.1:8082
    server {
        listen 127.0.0.1:8082;
        server_name other.local;
        location / { return 404; }
    }
    server {
        listen 127.0.0.1:8082;
        server_name auth.local;
        location / {
            auth_request /_auth;
            proxy_pass http://10.5.0.9:3000;
        }
        location = /_auth {
            internal;
            proxy_pass http://10.5.0.10:9000;
        }
    }
    # public site forwarding into the layers above
    server {
        listen 8080;
        server_name www.example.test;
        location / {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
        }
        location /admin/ {
            proxy_pass http://127.0.0.1:8082;
            proxy_set_header Host auth.local;
        }
        location /c2/ {
            proxy_pass http://cache_layer;
        }
        location /direct/ {
            proxy_pass http://10.5.0.3:8080;
        }
    }
    # a forwarding loop: loop-a → loop-b → loop-a
    server {
        listen 127.0.0.1:8090;
        server_name loop-a.local;
        location / { proxy_pass http://127.0.0.1:8091; }
    }
    server {
        listen 127.0.0.1:8091;
        server_name loop-b.local;
        location / { proxy_pass http://127.0.0.1:8090; }
    }
}
