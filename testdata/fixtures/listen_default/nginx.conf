error_log /dev/stderr;
pid /tmp/nginx-fixture.pid;
events {}

http {
    # no listen: implicit *:80 (assume_superuser on)
    server {
        server_name implicit-a.example;
        return 200 "a";
    }
    # explicit *:80, first one is NOT default because a later one is explicit default_server
    server {
        listen 80;
        server_name first.example;
        return 200 "first";
    }
    server {
        listen 80 default_server;
        server_name explicit-default.example;
        return 200 "default";
    }
    # specific address on the same port: separate address:port pair,
    # implicit default = first server on 127.0.0.1:80
    server {
        listen 127.0.0.1:80;
        server_name loopback-1.example;
        return 200 "lo1";
    }
    server {
        listen 127.0.0.1:80;
        server_name loopback-2.example;
        return 200 "lo2";
    }
    # IPv6 and protocol flags OR-ed across servers
    server {
        listen [::]:8443 ssl;
        http2 on;
        server_name v6.example;
        ssl_certificate     /etc/nginx-test/cert.pem;
        ssl_certificate_key /etc/nginx-test/key.pem;
        return 200 "v6";
    }
    server {
        listen [::]:8443 ssl proxy_protocol;
        server_name v6-pp.example;
        ssl_certificate     /etc/nginx-test/cert.pem;
        ssl_certificate_key /etc/nginx-test/key.pem;
        return 200 "v6pp";
    }
    server {
        listen 8080 bind;
        server_name bind.example;
        return 200 "bind";
    }
}
