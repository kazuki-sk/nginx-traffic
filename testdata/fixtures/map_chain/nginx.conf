error_log /dev/stderr;
pid /tmp/nginx-fixture.pid;
events {}

http {
    map $host $tenant {
        hostnames;
        default        public;
        a.example.com  alpha;
        *.b.example    beta;
        www.c.*        gamma;
        ~^t(?<num>\d+)\. "tenant$num";
    }
    map $tenant $pool {
        default  pool_public;
        alpha    pool_a;
        beta     pool_b;
    }
    map $pool $pool_addr {
        default  10.1.0.1:80;
        pool_a   10.1.0.2:80;
        pool_b   10.1.0.3:80;
    }
    # constant source: resolves to a single value
    map "alpha" $fixed {
        default  nope;
        alpha    yes;
    }
    split_clients "${remote_addr}AAA" $variant {
        10%  a;
        20%  b;
        *    c;
    }
    geo $office {
        default        0;
        10.0.0.0/8     1;
        192.168.0.0/16 2;
    }
    server {
        listen 8080;
        server_name map.example;
        location / {
            proxy_pass http://$pool_addr;
        }
        location /fixed {
            return 200 "$fixed";
        }
        location /ab {
            return 200 "$variant $office";
        }
    }
}
