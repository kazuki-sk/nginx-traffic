error_log /dev/stderr;
pid /tmp/nginx-fixture.pid;
events {}

http {
    server {
        listen 8080;
        server_name set.example;
        set $env prod;
        set $base /srv/$env;

        location / {
            root $base/html;
        }
        location /override {
            set $env staging;
            return 200 "$env $base";
        }
        location /cond {
            if ($http_x_debug) {
                set $env debug;
            }
            return 200 "$env";
        }
        location /known {
            if ($env = prod) {
                set $tier gold;
            }
            return 200 "$tier";
        }
        location /port {
            return 200 "$scheme://$server_name:$server_port";
        }
        location /nested {
            set $lvl outer;
            location /nested/inner {
                # rewrite codes are not inherited: $lvl keeps the server-phase value
                return 200 "$lvl";
            }
        }
    }
}
