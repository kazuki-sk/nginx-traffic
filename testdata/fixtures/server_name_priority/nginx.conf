error_log /dev/stderr;
pid /tmp/nginx-fixture.pid;
events {}

http {
    server {
        listen 8080;
        server_name ~^(?<sub>[a-z]+)\.regex\.example$;
        return 200 "regex1 $sub";
    }
    server {
        listen 8080;
        server_name www.example.com;
        return 200 "exact";
    }
    server {
        listen 8080;
        server_name *.example.com;
        return 200 "leading";
    }
    server {
        listen 8080;
        server_name *.api.example.com;
        return 200 "leading-longer";
    }
    server {
        listen 8080;
        server_name www.example.*;
        return 200 "trailing";
    }
    server {
        listen 8080;
        server_name .dot.example;
        return 200 "dot";
    }
    server {
        listen 8080;
        server_name ~^www\d+\.example\.net$ "";
        return 200 "regex2";
    }
    # duplicate exact name on the same listen: nginx warns and ignores it
    server {
        listen 8080;
        server_name www.example.com;
        return 200 "dup";
    }
}
