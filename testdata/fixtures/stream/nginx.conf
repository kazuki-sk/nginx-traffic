error_log /dev/stderr;
pid /tmp/nginx-fixture.pid;
events {}

stream {
    upstream db {
        server 10.3.0.1:5432 weight=2;
        server 10.3.0.2:5432 backup;
    }
    upstream dns_up {
        server 10.3.0.53:53;
    }
    map $ssl_preread_server_name $sni_backend {
        default        10.3.1.1:443;
        a.tls.example  10.3.1.2:443;
    }
    server {
        listen 5432;
        proxy_pass db;
    }
    server {
        listen 53 udp;
        proxy_pass dns_up;
    }
    server {
        listen 443;
        ssl_preread on;
        proxy_pass $sni_backend;
    }
    server {
        listen 9999;
        return "hello\n";
    }
}
