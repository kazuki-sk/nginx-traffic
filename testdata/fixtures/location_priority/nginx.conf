error_log /dev/stderr;
pid /tmp/nginx-fixture.pid;
events {}

http {
    upstream app { server 127.0.0.1:9000; }
    server {
        listen 8080;
        server_name loc.example;
        root /srv/www;
        error_page 404 /errors/404.html;
        error_page 500 502 503 504 @fallback;

        location = / {
            return 200 "exact root";
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
        location /errors/ {
            internal;
        }
        location ^~ /static/ {
            alias /srv/static/;
        }
        location ~* \.(png|jpg)$ {
            expires 7d;
        }
        location /api/ {
            proxy_pass http://app;
            location ~ ^/api/v[0-9]+/admin {
                return 403;
            }
            location /api/internal/ {
                proxy_pass http://127.0.0.1:9100;
            }
        }
        location ~ ^/old/(.*)$ {
            rewrite ^/old/(.*)$ /new/$1 last;
        }
        location /legacy {
            rewrite ^ /api/v2/legacy last;
        }
        location /go-home {
            rewrite ^ https://loc.example/ permanent;
        }
        location @fallback {
            proxy_pass http://app;
        }
    }
}
