# Sample internal server block that publishes the generated sitemap.
# NOT applied automatically. Review, adapt the placeholders and include it
# from your http {} block, e.g. /etc/nginx/conf.d/nginx-sitemap.conf.
#
# Placeholders (replace before use):
#   10.0.0.10                 → internal listen IP of this host
#   nginx-map.lab.internal    → internal host name
#   10.0.0.0/8, 192.168.0.0/16 → CIDRs allowed to view the map
#   /etc/nginx/tls/nginx-map.* → certificate for the internal name
#
# This server block is itself part of the nginx configuration, so it appears
# in the generated map like any other server.

server {
    # Listen on the internal address only (never on *:443).
    listen 10.0.0.10:443 ssl;
    http2 on;
    server_name nginx-map.lab.internal;

    ssl_certificate     /etc/nginx/tls/nginx-map.crt;
    ssl_certificate_key /etc/nginx/tls/nginx-map.key;

    root /var/lib/nginx-sitemap;
    index index.html;

    # Access control: internal networks only.
    allow 10.0.0.0/8;
    allow 192.168.0.0/16;
    deny  all;

    # Always fetch the latest snapshot.
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    etag off;
    if_modified_since off;

    access_log off;

    location = / {
        try_files /index.html =404;
    }
    location = /index.html { }
    location = /map.json {
        default_type application/json;
    }
    location = /map.dot {
        default_type text/plain;
    }
    # Nothing else (temp files written during atomic replace start with ".").
    location / {
        return 404;
    }
}
